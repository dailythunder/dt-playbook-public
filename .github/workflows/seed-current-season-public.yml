name: Seed Current Season Public Registry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seed-current-season-public.yml'
      - 'playbook/data/current_season_seed_trigger.txt'

permissions:
  contents: write

jobs:
  seed-current-season-public-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write current season public registry
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          blob = """"""
          out = Path('playbook/data')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'current_season_public.json').write_bytes(gzip.decompress(base64.b64decode(blob)))
          (out / 'current_season_public_report.md').write_text(
              '# Current Season Public Registry Report\n\n'
              '- Source: seeded from `newdtbuild/public_registry/season_state_public.json`\n'
              '- Public games written: 96\n'
              '- Note: this seed is overwritten by the normal newdtbuild publisher when `PLAYBOOK_PUBLIC_REPO_TOKEN` is available there.\n',
              encoding='utf-8'
          )
          PY
      - name: Commit seeded registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playbook/data/current_season_public.json playbook/data/current_season_public_report.md
          if git diff --cached --quiet; then
            echo "No current season registry changes to commit"
          else
            git commit -m "Seed current season public registry"
            git push
          fi

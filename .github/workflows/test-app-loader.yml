name: Test Playbook Loader
on:
  pull_request:
    paths:
      - 'playbook/assets/daily-product*.js'
      - 'playbook/data/current_season_public.json'
      - 'tests/*.cjs'
      - 'tests/fixtures/*.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/daily-product-load.test.cjs
      - run: node tests/daily-product-gameday.test.cjs
      - run: node tests/daily-product-contracts.test.cjs

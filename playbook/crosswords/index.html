<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playbook Crosswords</title>
  <link rel="stylesheet" href="../assets/playbook.css" />
</head>
<body>
  <main class="playbook-shell">
    <header class="playbook-header">
      <div class="kicker">Thunder Playbook</div>
      <h1>Archived Crosswords</h1>
      <p class="subtitle">Crossword wrappers in a clean editorial shell, with puzzle-surface framing.</p>
      <div class="nav-row">
        <a class="btn" href="../">← Playbook Home</a>
        <a class="btn btn-secondary" href="../games/">Published Games</a>
        <a class="btn btn-primary" href="../prototypes/">Playbook Lab</a>
      </div>
    </header>

    <section class="card">
      <div class="meta-row">
        <span class="chip gold" id="meta">Loading…</span>
      </div>
      <div class="play-surface">
        <ol id="list"></ol>
      </div>
    </section>
  </main>
<script>
(async function(){
  const res = await fetch('../data/playbook_index.json');
  const data = await res.json();
  document.getElementById('meta').textContent = `${data.crosswords_total} archived crossword puzzles`;
  const list = document.getElementById('list');
  data.crosswords.forEach((cw) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '../../' + cw.wrapper_path;
    a.textContent = cw.title;
    li.appendChild(a);
    list.appendChild(li);
  });
})();
</script>
</body>
</html>

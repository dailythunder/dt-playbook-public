<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playbook Games</title>
  <link rel="stylesheet" href="../assets/playbook.css" />
</head>
<body>
  <main class="playbook-shell">
    <header class="playbook-header">
      <div class="kicker">Thunder Playbook</div>
      <h1>Published Playbook Games</h1>
      <p class="subtitle">Game posts in a DT-native listing shell with playful in-card accents.</p>
      <div class="nav-row">
        <a class="btn" href="../">← Playbook Home</a>
        <a class="btn btn-secondary" href="../crosswords/">Crosswords</a>
        <a class="btn btn-primary" href="../prototypes/">Playbook Lab</a>
      </div>
    </header>

    <section class="card">
      <div class="meta-row">
        <span class="chip blue" id="meta">Loading…</span>
      </div>
      <ul class="list-clean" id="list"></ul>
    </section>
  </main>
<script>
(async function(){
  const res = await fetch('../data/playbook_index.json');
  const data = await res.json();
  document.getElementById('meta').textContent = `${data.games_total} indexed published game posts`;
  const list = document.getElementById('list');
  data.games.forEach((game) => {
    const li = document.createElement('li');
    li.className = 'list-item';
    li.innerHTML = `<a href="${game.url}" target="_blank" rel="noreferrer">${game.game}</a><div class="date">${new Date(game.published_at).toISOString().slice(0,10)}</div>`;
    list.appendChild(li);
  });
})();
</script>
</body>
</html>
